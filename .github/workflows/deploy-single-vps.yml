name: deploy-single-vps

# Deploys after build-images publishes an atomic GHCR release and mirror-images
# finishes copying the changed components to the optional operator registry.
#
# Trigger:
#   • Auto: when mirror-images completes on main (so the selected registry is ready)
#   • Manual: workflow_dispatch with a specific image tag
#
# Secrets model: the VPS assembles its own compose `.env` (see docs/ADR/0031),
# so CI ships NO application secrets — it only needs SSH access. Postgres
# passwords are generated on the VPS; operator secrets are decrypted on the VPS
# from the committed, SOPS-encrypted infra/single-vps/secrets.sops.env.
#
# Prerequisites (set ONCE in repo Settings → Secrets and variables → Actions):
#   secrets.VPS_HOST         — public IP or hostname of the VPS
#   secrets.VPS_USER         — SSH user (e.g. root)
#   secrets.VPS_SSH_KEY      — full private key matching ~/.ssh/authorized_keys
#                              on the VPS (OpenSSH format, including the
#                              BEGIN/END lines)
#   vars.PUBLIC_PORT         — port the host exposes (default 8080)
#   vars.PUBLIC_GATEWAY_URL  — optional public origin (default http://VPS_HOST:PUBLIC_PORT)
#   vars.DEPLOY_DIR          — remote dir (default /opt/monorepo)
#   vars.IMAGE_REGISTRY      — (optional) override default ghcr.io path

on:
  workflow_run:
    workflows: ["mirror-images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (default: sha-<current short sha>)"
        required: false
      reset_data:
        description: "Destroy and recreate every VPS data volume before deploy"
        required: false
        type: boolean
        default: false
      reset_application_data:
        description: "Recreate app data while preserving Admin and IAM"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-single-vps
  cancel-in-progress: false

jobs:
  deploy:
    # Skip auto-run if image publication failed; manual runs always proceed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    environment:
      name: single-vps
      # Add yourself as a required reviewer in repo Settings → Environments
      # if you want a manual approval gate before every deploy.
    steps:
      - name: Download automatic release metadata
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: image-plan
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            HEAD_SHA="$(jq -r '.headSha' release/image-plan.json)"
            TAG="$(jq -r '.imageTag' release/image-plan.json)"
          else
            HEAD_SHA="${GITHUB_SHA}"
            TAG="${MANUAL_TAG:-sha-$(echo "${GITHUB_SHA}" | cut -c1-8)}"
          fi
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.head_sha }}

      - name: Resolve image tag
        id: vars
        run: |
          echo "tag=${{ steps.release.outputs.tag }}" >> "$GITHUB_OUTPUT"

          REGISTRY="${{ vars.IMAGE_REGISTRY }}"
          if [ -z "${REGISTRY}" ]; then
            # Lowercase the repo path; GHCR requires lowercase.
            REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            REGISTRY="ghcr.io/${REPO_LC}"
          fi
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

          PORT="${{ vars.PUBLIC_PORT }}"
          echo "port=${PORT:-8080}" >> "$GITHUB_OUTPUT"

          DEPLOY_DIR="${{ vars.DEPLOY_DIR }}"
          echo "deploy_dir=${DEPLOY_DIR:-/opt/monorepo}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          # Bind the dedicated key to this host. deploy.sh later runs
          # `ssh user@host …` and `curl http://host:port/healthz`, so we key
          # off the real hostname (not an alias) to keep the curl probe working.
          cat <<EOF > ~/.ssh/config
          Host ${VPS_HOST}
              IdentityFile ~/.ssh/id_deploy
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy
        env:
          IMAGE_REGISTRY: ${{ steps.vars.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          PUBLIC_PORT: ${{ steps.vars.outputs.port }}
          PUBLIC_GATEWAY_URL: ${{ vars.PUBLIC_GATEWAY_URL }}
          DEPLOY_DIR: ${{ steps.vars.outputs.deploy_dir }}
          RESET_DATA: ${{ inputs.reset_data || 'false' }}
          RESET_APPLICATION_DATA: ${{ inputs.reset_application_data || 'false' }}
        run: |
          # deploy.sh rsyncs the ops files (incl. the SOPS-encrypted
          # secrets.sops.env) and runs render-env.sh on the VPS, which
          # generates the internal Postgres passwords and decrypts the
          # operator secrets with the VPS-local age key. No secrets here.
          ./infra/single-vps/deploy.sh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f ~/.ssh/id_deploy
