name: backend

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'schemas/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'mise.toml'
      - 'justfile'
      - 'scripts/**'
      - 'services.yaml'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/backend install --frozen-lockfile
      - run: uv lock --project apps/backend --check
      - run: uv sync --project apps/backend --all-packages
      - name: Test every backend service and library
        run: just test backend
      - name: Static checks and formatting
        working-directory: apps/backend
        run: |
          just lint
          uv run ruff format --check .
      - name: Build backend services
        working-directory: apps/backend
        run: |
          just build-go
          just build-node
      - name: Go module consistency
        working-directory: apps/backend
        run: |
          for manifest in services/*/go.mod; do
            (cd "$(dirname "$manifest")" && go mod tidy && git diff --exit-code -- go.mod go.sum)
          done
