name: backend

on:
  workflow_call:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'schemas/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'mise.toml'
      - 'justfile'
      - 'ruff.toml'
      - 'oxlint.config.ts'
      - 'oxfmt.config.ts'
      - '.pre-commit-config.yaml'
      - 'infra/single-vps/tests/**'
      - 'scripts/**'
      - 'services.yaml'
      - '.github/workflows/backend.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/backend install --frozen-lockfile
      - run: uv lock --project apps/backend --check
      - run: uv sync --project apps/backend --all-packages
      - name: Test affected backend services and libraries
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'all' }}
        run: just test-affected "$TEST_BASE" backend
      - name: Python lint, formatting and types (including repository scripts)
        env:
          RUFF_OUTPUT_FORMAT: github
        run: just check-py
      - name: Node and Go static checks
        working-directory: apps/backend
        run: |
          just lint-node
          just lint-go
      - name: Build backend services
        working-directory: apps/backend
        run: |
          just build-go
          just build-node
      - name: Go module consistency
        working-directory: apps/backend
        run: |
          for manifest in services/*/go.mod; do
            (cd "$(dirname "$manifest")" && go mod tidy && git diff --exit-code -- go.mod go.sum)
          done
