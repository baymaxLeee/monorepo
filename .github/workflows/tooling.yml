name: tooling

on:
  workflow_call:
  pull_request:
    paths:
      - 'scripts/**'
      - 'apps/backend/services/**/migrations/**'
      - 'infra/single-vps/Dockerfile.db-init'
      - 'infra/single-vps/postgres-init.sh'
      - '**/AGENTS.md'
      - '**/AGENTS.override.md'
      - '.agents/**'
      - '.cursor/**'
      - 'docs/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'package.json'
      - 'apps/**/package.json'
      - 'apps/**/tsconfig*.json'
      - 'apps/frontend/packages/typescript-config/**'
      - 'justfile'
      - 'oxlint.config.ts'
      - 'oxfmt.config.ts'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - 'mise.toml'
      - 'services.yaml'
      - '.github/workflows/tooling.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Install shared Oxc tools
        run: pnpm install --frozen-lockfile
      - name: Install TS7 for environment configuration tests
        run: pnpm --dir apps/frontend --filter frontend-workspace install --frozen-lockfile
      - name: Check repository JavaScript and TypeScript
        run: |
          pnpm lint:ts oxlint.config.ts oxfmt.config.ts scripts
          pnpm exec oxfmt --check oxlint.config.ts oxfmt.config.ts package.json 'scripts/**/*.{js,mjs,cjs,jsx,ts,tsx,mts,cts,json,jsonc}'
      - name: Check repository graph and documentation navigation
        run: just check-repo
      - name: Test affected CLI behavior
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'all' }}
        run: just test-affected "$TEST_BASE" tooling

  database-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Verify data-preserving upgrades on disposable PostgreSQL
        run: just test-db-migrations
