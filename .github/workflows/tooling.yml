name: tooling

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'justfile'
      - 'mise.toml'
      - 'services.yaml'
      - '.github/workflows/tooling.yml'
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just test tooling
