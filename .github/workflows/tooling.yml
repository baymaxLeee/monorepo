name: tooling

on:
  workflow_call:
  pull_request:
    paths:
      - 'scripts/**'
      - 'justfile'
      - 'mise.toml'
      - 'services.yaml'
      - '.github/workflows/tooling.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Test affected CLI behavior
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'all' }}
        run: just test-affected "$TEST_BASE" tooling
