name: deploy-prod

# Deploys backend services to the production K8s cluster.
#
# Trigger:
#   - workflow_dispatch (manual, with image tag input)
#   - tag push v*.*.*   (auto, image tag = git tag)
#
# Prerequisite: build-images.yml has already pushed images with the same tag
# to the configured registry. Recommended: use the same git-sha or git-tag.
#
# Required secrets / vars:
#   vars.IMAGE_REGISTRY               (same as build-images)
#   secrets.KUBECONFIG_PROD           (base64-encoded kubeconfig for prod cluster)
#   The cluster MUST already have:
#     - namespace `monorepo-prod`
#     - Secrets: gateway-secrets, iam-secrets, admin-secrets, knowledge-secrets,
#       telemetry-secrets, chat-secrets, executor-secrets, canvas-secrets, and
#       postgres-admin-secrets (migration-only managed Postgres credentials)
#     - TLS Secret: api-tls
#     - Nginx Ingress Controller installed
#   See infra/k8s/overlays/prod/README.md for one-time setup.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. sha-abc12345 or v1.2.3)"
        required: true
        type: string
  push:
    tags: ['v*.*.*']

concurrency:
  # Serialize prod deploys; a second deploy waits for the first to finish.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      # Manual approval gate; configure required reviewers in repo Settings →
      # Environments → production.
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No image tag resolved"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "registry=${{ vars.IMAGE_REGISTRY }}" >> "$GITHUB_OUTPUT"

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tgz -C /usr/local/bin
          kustomize version

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > "$HOME/.kube/config"
          kubectl version --client
          kubectl get nodes

      - name: Pin image tags in prod overlay
        working-directory: infra/k8s/overlays/prod
        run: |
          REG="${{ steps.vars.outputs.registry }}"
          TAG="${{ steps.vars.outputs.tag }}"
          for svc in gateway iam canvas admin chat knowledge telemetry executor web; do
            kustomize edit set image \
              "ghcr.io/example/${svc}=${REG}/${svc}:${TAG}"
          done
          # Show the result so the deploy log records exactly what is applied.
          grep -A 3 '^images:' kustomization.yaml

      - name: Render manifest (dry-run sanity check)
        working-directory: infra/k8s/overlays/prod
        run: |
          kustomize build --load-restrictor=LoadRestrictionsNone . > /tmp/prod-manifest.yaml
          sed -n '1,200p' /tmp/prod-manifest.yaml

      - name: Apply database migrations
        working-directory: infra/k8s
        run: |
          REG="${{ steps.vars.outputs.registry }}"
          TAG="${{ steps.vars.outputs.tag }}"
          JOB_NAME="db-migrate-$(date +%s)"
          kustomize build base/db-migrate \
            | sed "s|name: db-migrate$|name: ${JOB_NAME}|" \
            | sed "s|ghcr.io/example/db-init:latest|${REG}/db-init:${TAG}|" \
            | kubectl apply -n monorepo-prod -f -
          if ! kubectl -n monorepo-prod wait --for=condition=complete \
            --timeout=10m job/${JOB_NAME}; then
            kubectl -n monorepo-prod describe job/${JOB_NAME}
            kubectl -n monorepo-prod logs job/${JOB_NAME} --all-containers=true || true
            exit 1
          fi

      - name: Apply Workflow World schema
        run: |
          REG="${{ steps.vars.outputs.registry }}"
          TAG="${{ steps.vars.outputs.tag }}"
          JOB_NAME="workflow-db-migrate-$(date +%s)"
          cat <<EOF | kubectl apply -n monorepo-prod -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB_NAME}
            labels: { app: workflow-db-migrate }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 86400
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${REG}/executor:${TAG}
                    env:
                      - name: WORKFLOW_POSTGRES_URL
                        valueFrom:
                          secretKeyRef: { name: executor-secrets, key: WORKFLOW_POSTGRES_URL }
                    command: ["node", "node_modules/@workflow/world-postgres/bin/setup.js"]
                    resources:
                      requests: { cpu: 50m, memory: 64Mi }
                      limits: { cpu: 500m, memory: 256Mi }
          EOF
          if ! kubectl -n monorepo-prod wait --for=condition=complete \
            --timeout=10m job/${JOB_NAME}; then
            kubectl -n monorepo-prod describe job/${JOB_NAME}
            kubectl -n monorepo-prod logs job/${JOB_NAME} --all-containers=true || true
            exit 1
          fi

      # One-shot identity bootstrap Job: run BEFORE rolling the Deployments so the
      # super-admin + guest-org exist before any iam replica serves traffic. The
      # bootstrap is idempotent — safe to re-run every deploy. If it fails, the
      # deploy aborts and existing pods keep serving on the current data.
      - name: Bootstrap iam identity (super-admin + guest-org)
        working-directory: infra/k8s
        run: |
          # SQL schemas were applied by the preceding migration gate. This Job
          # ONLY runs iam's `seed` subcommand —
          # the sole carrier of the password-hashed identity bootstrap, lifted
          # out of the server start path so replicas don't each re-seed.
          REG="${{ steps.vars.outputs.registry }}"
          TAG="${{ steps.vars.outputs.tag }}"
          JOB_NAME="iam-bootstrap-$(date +%s)"
          cat <<EOF | kubectl apply -n monorepo-prod -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB_NAME}
            labels: { app: iam-bootstrap }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 86400
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: seed
                    image: ${REG}/iam:${TAG}
                    env:
                      - { name: ENVIRONMENT, value: production }
                      - name: POSTGRES_HOST
                        valueFrom: { secretKeyRef: { name: iam-secrets, key: POSTGRES_HOST } }
                      - name: POSTGRES_PORT
                        valueFrom: { configMapKeyRef: { name: iam-config, key: POSTGRES_PORT } }
                      - name: POSTGRES_USER
                        valueFrom: { secretKeyRef: { name: iam-secrets, key: POSTGRES_USER } }
                      - name: POSTGRES_PASSWORD
                        valueFrom: { secretKeyRef: { name: iam-secrets, key: POSTGRES_PASSWORD } }
                      - name: IAM_POSTGRES_DATABASE
                        valueFrom: { configMapKeyRef: { name: iam-config, key: IAM_POSTGRES_DATABASE } }
                      - name: SUPER_ADMIN_ACCOUNT
                        valueFrom: { secretKeyRef: { name: iam-secrets, key: SUPER_ADMIN_ACCOUNT } }
                      - name: SUPER_ADMIN_EMAIL
                        valueFrom: { secretKeyRef: { name: iam-secrets, key: SUPER_ADMIN_EMAIL } }
                      - name: SUPER_ADMIN_PASSWORD
                        valueFrom: { secretKeyRef: { name: iam-secrets, key: SUPER_ADMIN_PASSWORD } }
                      - name: GUEST_WORKSPACE_ID
                        valueFrom: { configMapKeyRef: { name: iam-config, key: GUEST_WORKSPACE_ID } }
                      - name: GUEST_WORKSPACE_NAME
                        valueFrom: { configMapKeyRef: { name: iam-config, key: GUEST_WORKSPACE_NAME } }
                      - name: GUEST_WORKSPACE_SLUG
                        valueFrom: { configMapKeyRef: { name: iam-config, key: GUEST_WORKSPACE_SLUG } }
                    command: ["/server"]
                    args: ["seed"]
          EOF
          if ! kubectl -n monorepo-prod wait --for=condition=complete \
            --timeout=5m job/${JOB_NAME}; then
            kubectl -n monorepo-prod describe job/${JOB_NAME}
            kubectl -n monorepo-prod logs job/${JOB_NAME} --all-containers=true || true
            exit 1
          fi

      - name: Apply prod manifest (secrets excluded — managed out-of-band)
        working-directory: infra/k8s/overlays/prod
        run: |
          kustomize build --load-restrictor=LoadRestrictionsNone . \
            | kubectl apply -f -

      - name: Wait for rollouts
        run: |
          for svc in gateway iam canvas admin chat knowledge telemetry executor web; do
            kubectl -n monorepo-prod rollout status deployment/${svc} --timeout=5m
          done

      - name: Post-deploy smoke
        run: |
          # Hit /livez via the cluster service IP (port-forward); replace with
          # external smoke against https://api.your-domain.com/livez once DNS
          # / Cloudflare are wired up.
          kubectl -n monorepo-prod get pods,deployments,svc,ingress
