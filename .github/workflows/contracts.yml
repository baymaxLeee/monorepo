name: contracts

on:
  workflow_call:
  pull_request:
    paths:
      - 'schemas/**'
      - 'apps/backend/libs/transport-ts/**'
      - 'apps/backend/services/**'
      - 'package.json'
      - 'mise.toml'
      - 'apps/backend/package.json'
      - 'apps/backend/pnpm-lock.yaml'
      - 'apps/frontend/pnpm-lock.yaml'
      - 'apps/frontend/pnpm-workspace.yaml'
      - 'apps/frontend/.pnpmfile.mjs'
      - 'apps/frontend/packages/api/**'
      - 'justfile'
      - '.github/workflows/contracts.yml'

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/backend install --frozen-lockfile
      - run: pnpm --dir apps/frontend install --frozen-lockfile
      - run: uv sync --project apps/backend --all-packages --locked
      - run: just sync-check
      - run: pnpm --dir apps/backend --filter @backend/transport-ts typecheck
      - run: pnpm --dir apps/frontend typecheck

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Protobuf changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^)
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$BASE_SHA" HEAD -- schemas/proto; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: bufbuild/buf-action@v1
        if: steps.changes.outputs.changed == 'true'
        with:
          input: schemas/proto
          lint: true
          format: true
          breaking: true
          breaking_against: '.git#ref=${{ steps.changes.outputs.base }},subdir=schemas/proto'
          push: false
          pr_comment: false
