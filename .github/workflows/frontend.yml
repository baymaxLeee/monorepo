name: frontend

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'schemas/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'mise.toml'
      - 'justfile'
      - 'scripts/test.mjs'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install root lint tooling
        working-directory: .
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - name: Frontend behavior tests
        working-directory: .
        run: just test frontend
      - run: just lint
      - run: pnpm -F platform build
      - run: pnpm -F admin build
      - run: pnpm -F chat build
      - run: pnpm -F canvas build
