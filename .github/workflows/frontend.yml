name: frontend

on:
  workflow_call:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'schemas/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'mise.toml'
      - 'justfile'
      - 'scripts/*.mjs'
      - '.github/workflows/frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Install root lint tooling
        working-directory: .
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - name: Affected frontend behavior tests
        working-directory: .
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'all' }}
        run: just test-affected "$TEST_BASE" frontend
      - run: just lint
      - run: pnpm -F platform build
      - run: pnpm -F admin build
      - run: pnpm -F chat build
      - run: pnpm -F canvas build
