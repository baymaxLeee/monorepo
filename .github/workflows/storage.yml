name: storage

on:
  pull_request:
    paths:
      - 'apps/backend/services/storage/**'
      - 'infra/single-vps/tests/test-storage-volume.py'
      - '.github/workflows/storage.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/services/storage/**'
      - 'infra/single-vps/tests/test-storage-volume.py'
      - '.github/workflows/storage.yml'

jobs:
  volume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: docker build -t monorepo-storage:volume-test apps/backend/services/storage
      - name: Verify non-root volume writes and container recreation
        env:
          STORAGE_TEST_IMAGE: monorepo-storage:volume-test
        run: python3 infra/single-vps/tests/test-storage-volume.py
