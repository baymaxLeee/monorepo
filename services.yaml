# Canonical backend service graph — see docs/ADR/architecture.md
# Validation only: scripts/check-services.py (no generators).

services:
  gateway:
    root: apps/backend/services/gateway
    runtime: go
    port: 8000
    publicRoutes:
      - /*
    bindings:
      - iam
      - admin
      - chat
      - canvas
      - knowledge
      - telemetry
      - storage
    databases: []
    openapi: null

  iam:
    root: apps/backend/services/iam
    runtime: go
    port: 8002
    publicRoutes:
      - /api/iam-server/*
    bindings: []
    databases:
      - iam
    openapi: schemas/openapi/iam-server.json
    openapiVersion: 3.1.0

  admin:
    root: apps/backend/services/admin
    runtime: go
    port: 8001
    rpcPort: 9001
    publicRoutes:
      - /api/admin-server/*
    bindings:
      - storage
    databases:
      - admin
    openapi: schemas/openapi/admin-server.json
    openapiVersion: 3.1.0

  chat:
    root: apps/backend/services/chat
    runtime: go
    port: 8009
    publicRoutes:
      - /api/chat-server/*
    bindings:
      - runtime
    databases:
      - chat
    openapi: schemas/openapi/chat-server.json
    openapiVersion: 3.0.3

  runtime:
    root: apps/backend/services/runtime
    runtime: node
    port: 8015
    publicRoutes: []
    bindings:
      - admin
      - knowledge
      - canvas
      - storage
    databases:
      - runtime
      - workflow
    openapi: schemas/openapi/runtime-server.json
    openapiVersion: 3.0.3

  knowledge:
    root: apps/backend/services/knowledge
    runtime: python
    port: 8010
    rpcPort: 9010
    publicRoutes:
      - /api/knowledge-server/*
    bindings:
      - admin
      - storage
    databases:
      - knowledge
    openapi: schemas/openapi/knowledge-server.json
    openapiVersion: 3.1.0

  telemetry:
    root: apps/backend/services/telemetry
    runtime: go
    port: 8008
    publicRoutes:
      - /api/telemetry-server/*
    bindings: []
    databases:
      - telemetry
    openapi: schemas/openapi/telemetry-server.json
    openapiVersion: 3.1.0

  canvas:
    root: apps/backend/services/canvas
    runtime: go
    port: 8012
    rpcPort: 9012
    publicRoutes:
      - /api/canvas-server/*
    bindings:
      - admin
      - storage
    databases:
      - canvas
    openapi: schemas/openapi/canvas-server.json
    openapiVersion: 3.0.3

  storage:
    root: apps/backend/services/storage
    runtime: go
    port: 8013
    rpcPort: 9013
    publicRoutes:
      - /api/storage-server/*
    bindings: []
    databases:
      - storage
    openapi: schemas/openapi/storage-server.json
    openapiVersion: 3.1.0
