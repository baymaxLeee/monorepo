# SOPS creation rules — which age recipients can decrypt which files.
#
# The single-VPS operator secrets are encrypted to the VPS's own age key. The
# private key lives ONLY on the VPS (generated by infra/single-vps/bootstrap.sh);
# the public key below is safe to commit.
#
# RECOMMENDED follow-up — add an OFFLINE recovery recipient so a lost VPS can be
# rebuilt and the ciphertext (incl. the must-stay-stable ADMIN_SECRET_KEY) is
# still recoverable (SOPS natively supports multiple recipients —
# https://github.com/getsops/sops):
#   1. age-keygen -o recovery.key      # store recovery.key OFFLINE, never in git
#   2. add its public key as a second, comma-separated `age:` recipient below
#   3. sops updatekeys infra/single-vps/secrets.sops.env
creation_rules:
  - path_regex: infra/single-vps/secrets\.sops\.env$
    age: "age1k9scqep8mhrz420svczxr0yfj7q0ucpthk9psc8f7n0awr0rmfvq5sreph"
