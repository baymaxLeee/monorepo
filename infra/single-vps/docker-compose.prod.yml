# Single-VPS production stack.
#
# Runs on ONE box behind a single public port (PUBLIC_PORT, default 8080).
# Everything is fronted by nginx (the `web` service) which serves the SPA
# static assets AND reverse-proxies /api/* to the gateway.
#
# Architecture:
#
#   browser  →  nginx (web, port 80 in-container, mapped to host PUBLIC_PORT)
#                 ├─ /             → SPA platform dist
#                 ├─ /mfe-admin/   → MFE admin dist
#                 ├─ /mfe-chat/    → MFE chat dist
#                 └─ /api/*        → reverse-proxy → gateway:8000
#                                     ├─ iam:8002
#                                     ├─ admin:8001
#                                     ├─ chat:8009
#                                     ├─ knowledge:8010
#                                     └─ telemetry:8008
#                                         ↓
#                                    postgres + redis (internal)
#
# One shared Postgres instance (pgvector image) holds every service database
# (iam / admin / chat / executor / telemetry business schemas, knowledge rows +
# RAG vectors, and executor's Workflow DevKit World) — see docs/ADR/0029.
#
# Image source: ghcr.io/<owner>/<repo>/<service>:<tag>
# Images are built and pushed by .github/workflows/build-images.yml.
#
# Usage (on the VPS, after bootstrap.sh):
#   cd /opt/monorepo && docker compose -f docker-compose.prod.yml pull
#   cd /opt/monorepo && docker compose -f docker-compose.prod.yml up -d
#
# All knobs live in `.env` (see .env.example).

x-restart: &restart_policy
  restart: unless-stopped

# iam identity + DB env, shared by the one-shot bootstrap (`seed`) and the server.
# One source of truth stops the super-admin / guest-org values from drifting between
# the container that WRITES them (iam-bootstrap) and the one that only reads them.
x-iam-env: &iam-env
  ENVIRONMENT: single-vps
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: iam
  POSTGRES_PASSWORD: ${IAM_POSTGRES_PASSWORD:?IAM_POSTGRES_PASSWORD is required}
  IAM_POSTGRES_DATABASE: iam
  SUPER_ADMIN_ACCOUNT: ${SUPER_ADMIN_ACCOUNT:?SUPER_ADMIN_ACCOUNT is required}
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL is required}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
  SUPER_ADMIN_DISPLAY_NAME: ${SUPER_ADMIN_DISPLAY_NAME:-Super Admin}
  GUEST_ORG_ID: ${GUEST_ORG_ID:-guest-org}
  GUEST_ORG_NAME: ${GUEST_ORG_NAME:-游客组织}
  GUEST_ORG_SLUG: ${GUEST_ORG_SLUG:-guest-org}

services:
  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60 1"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *restart_policy

  # Single shared Postgres instance (pgvector superset image). Holds:
  #   - `workflow`  → executor's Workflow DevKit World (@workflow/world-postgres)
  #   - `knowledge` → knowledge service rows + RAG vectors (CREATE EXTENSION vector)
  #   - `iam` / `admin` / `chat` / `executor` / `telemetry` → business schemas
  # All migrated off MySQL (docs/ADR/0029). Local dev runs the same container
  # (root docker-compose.yml) for dev/prod parity — see docs/微服务/executor.md.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: monorepo-postgres
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${WORKFLOW_POSTGRES_PASSWORD:?WORKFLOW_POSTGRES_PASSWORD is required}
      POSTGRES_DB: workflow
    command:
      # Tune for ~1GB available RAM after OS + Docker + apps.
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow"]
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *restart_policy

  clickhouse:
    image: clickhouse/clickhouse-server:26.6.1.1193
    container_name: monorepo-clickhouse
    mem_limit: 1200m
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse-low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/low-memory.xml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    <<: *restart_policy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    container_name: monorepo-otel-collector
    mem_limit: 256m
    depends_on:
      clickhouse: { condition: service_healthy }
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    <<: *restart_policy

  # Custom image (built by build-images.yml) bundles postgres-init.sh, the
  # canonical scripts/db-migrate.sh, and each service's migration SQL. Creates
  # the per-service databases and applies pending migrations against the shared
  # Postgres instance over TCP, creating one database and login role per service.
  db-init:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/db-init:${IMAGE_TAG:-main}
    container_name: monorepo-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_ADMIN_USER: workflow
      POSTGRES_ADMIN_PASSWORD: ${WORKFLOW_POSTGRES_PASSWORD:?WORKFLOW_POSTGRES_PASSWORD is required}
      IAM_POSTGRES_PASSWORD: ${IAM_POSTGRES_PASSWORD:?IAM_POSTGRES_PASSWORD is required}
      ADMIN_POSTGRES_PASSWORD: ${ADMIN_POSTGRES_PASSWORD:?ADMIN_POSTGRES_PASSWORD is required}
      CHAT_POSTGRES_PASSWORD: ${CHAT_POSTGRES_PASSWORD:?CHAT_POSTGRES_PASSWORD is required}
      EXECUTOR_POSTGRES_PASSWORD: ${EXECUTOR_POSTGRES_PASSWORD:?EXECUTOR_POSTGRES_PASSWORD is required}
      KNOWLEDGE_POSTGRES_PASSWORD: ${KNOWLEDGE_POSTGRES_PASSWORD:?KNOWLEDGE_POSTGRES_PASSWORD is required}
      TELEMETRY_POSTGRES_PASSWORD: ${TELEMETRY_POSTGRES_PASSWORD:?TELEMETRY_POSTGRES_PASSWORD is required}
    restart: "no"

  workflow-db-init:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/executor:${IMAGE_TAG:-main}
    container_name: monorepo-workflow-db-init
    depends_on:
      postgres: { condition: service_healthy }
    command: ["node", "node_modules/@workflow/world-postgres/bin/setup.js"]
    environment:
      WORKFLOW_POSTGRES_URL: postgres://workflow:${WORKFLOW_POSTGRES_PASSWORD}@postgres:5432/workflow
    restart: "no"

  # One-shot identity bootstrap: idempotently creates the super-admin + guest-org
  # (password hashing + multi-table domain rules a SQL seed can't express), then
  # exits. Runs AFTER schema migrations (db-init) and gates the iam server, so
  # server replicas never each re-run the bootstrap on start. See docs/ADR/0030.
  iam-bootstrap:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/iam:${IMAGE_TAG:-main}
    container_name: monorepo-iam-bootstrap
    depends_on:
      db-init: { condition: service_completed_successfully }
    command: ["seed"]
    environment:
      <<: *iam-env
    restart: "no"

  iam:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/iam:${IMAGE_TAG:-main}
    container_name: monorepo-iam
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      iam-bootstrap: { condition: service_completed_successfully }
    environment:
      <<: *iam-env
      PORT: "8002"
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      ACCESS_TOKEN_TTL: "5m"
      REFRESH_TOKEN_TTL: "720h"
      REFRESH_COOKIE_NAME: refresh_token
      # HTTP same-origin → Secure must be false, SameSite=Lax works fine.
      REFRESH_COOKIE_SECURE: "false"
      REFRESH_COOKIE_SAMESITE: lax
      # Host-only (no Domain attr); good for single-host IP-based deploy.
      REFRESH_COOKIE_DOMAIN: ""
    <<: *restart_policy

  gateway:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/gateway:${IMAGE_TAG:-main}
    container_name: monorepo-gateway
    depends_on:
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }
    environment:
      ENVIRONMENT: single-vps
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      PORT: "8000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      ADMIN_SERVICE_URL: http://admin:8001
      CHAT_SERVICE_URL: http://chat:8009
      IAM_SERVICE_URL: http://iam:8002
      KNOWLEDGE_SERVICE_URL: http://knowledge:8010
      TELEMETRY_SERVICE_URL: http://telemetry:8008
      # Same-origin behind nginx → browser never sends Origin for navigations.
      # Wildcard kept for occasional curl/tools with credentials.
      ALLOWED_FRONTEND_ORIGINS: "*"
      # Ingest stream may upload multiple 10 MiB attachments in one multipart body.
      MAX_REQUEST_BODY_BYTES: "104857600"
    <<: *restart_policy

  admin:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/admin:${IMAGE_TAG:-main}
    container_name: monorepo-admin
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    environment:
      ENVIRONMENT: single-vps
      OTEL_SERVICE_NAME: admin
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: "8001"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${ADMIN_POSTGRES_PASSWORD:?ADMIN_POSTGRES_PASSWORD is required}
      POSTGRES_DATABASE: admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # Fernet key encrypting model_providers.api_key_enc.
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?ADMIN_SECRET_KEY is required}
      # Shared secret with chat for `/internal/*` calls.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
    <<: *restart_policy

  chat:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/chat:${IMAGE_TAG:-main}
    container_name: monorepo-chat
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    environment:
      ENVIRONMENT: single-vps
      OTEL_SERVICE_NAME: chat
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: "8009"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${CHAT_POSTGRES_PASSWORD:?CHAT_POSTGRES_PASSWORD is required}
      POSTGRES_DATABASE: chat
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "2"
      # admin owns LLM credentials; chat asks it for decrypted snapshots.
      ADMIN_SERVICE_URL: http://admin:8001
      KNOWLEDGE_SERVICE_URL: http://knowledge:8010
      EXECUTOR_SERVICE_URL: http://executor:8011
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?TAVILY_API_KEY is required}
    <<: *restart_policy

  executor:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/executor:${IMAGE_TAG:-main}
    container_name: monorepo-executor
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      workflow-db-init: { condition: service_completed_successfully }
    environment:
      ENVIRONMENT: single-vps
      OTEL_SERVICE_NAME: executor
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: "8011"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: executor
      POSTGRES_PASSWORD: ${EXECUTOR_POSTGRES_PASSWORD:?EXECUTOR_POSTGRES_PASSWORD is required}
      POSTGRES_DATABASE: executor
      # No default World here (unlike executor/.env.example's commented-out
      # local-dev hint): a deployed environment MUST use the durable Postgres
      # World, never the filesystem-backed Local World (it isn't shared
      # across replicas or container restarts).
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://workflow:${WORKFLOW_POSTGRES_PASSWORD}@postgres:5432/workflow
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: "20"
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: "24"
      HTML_BLOCK_CONCURRENCY: "8"
      # Shared secret with chat/admin for `/internal/*`-style calls.
      # Must match chat-secrets.INTERNAL_API_TOKEN exactly.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Provider calls (SSRF-guarded); knowledge owns the published document.
      ADMIN_SERVICE_URL: http://admin:8001
      KNOWLEDGE_SERVICE_URL: http://knowledge:8010
      # Reverse channel: push task progress/terminal events to chat.
      CHAT_SERVICE_URL: http://chat:8009
    <<: *restart_policy

  knowledge:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/knowledge:${IMAGE_TAG:-main}
    container_name: monorepo-knowledge
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      ENVIRONMENT: single-vps
      OTEL_SERVICE_NAME: knowledge
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: "8010"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${KNOWLEDGE_POSTGRES_PASSWORD:?KNOWLEDGE_POSTGRES_PASSWORD is required}
      POSTGRES_DATABASE: knowledge
      ADMIN_SERVICE_URL: http://admin:8001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      KNOWLEDGE_DATA_DIR: /data/objects
      MAX_OBJECT_BYTES: ${MAX_OBJECT_BYTES:-10485760}
    volumes:
      - knowledge_data:/data/objects
    <<: *restart_policy

  telemetry:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/telemetry:${IMAGE_TAG:-main}
    container_name: monorepo-telemetry
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    environment:
      ENVIRONMENT: single-vps
      OTEL_SERVICE_NAME: telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CLICKHOUSE_HTTP_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      PORT: "8008"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${TELEMETRY_POSTGRES_PASSWORD:?TELEMETRY_POSTGRES_PASSWORD is required}
      POSTGRES_DATABASE: telemetry
    <<: *restart_policy

  # The `web` image is built by .github/workflows/build-images.yml
  # and contains:
  #   /usr/share/nginx/html             ← platform dist
  #   /usr/share/nginx/html/mfe-admin/  ← admin (MFE remote) dist
  #   /usr/share/nginx/html/mfe-chat/   ← chat  (MFE remote) dist
  #   /etc/nginx/conf.d/default.conf    ← nginx.conf from this directory
  web:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/web:${IMAGE_TAG:-main}
    container_name: monorepo-web
    depends_on:
      - gateway
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    <<: *restart_policy

volumes:
  redis_data:
  knowledge_data:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
