apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - network.yaml
  - proxy.yaml
  - quota.yaml
  - host-boundary.yaml
configMapGenerator:
  - name: sandbox-egress-policy
    literals:
      - SANDBOX_EGRESS_MODE=allowlist
      - SANDBOX_EGRESS_EXTRA_DOMAINS=
