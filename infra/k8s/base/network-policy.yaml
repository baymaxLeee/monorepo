apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [gateway, web]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-services
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: [gateway, web, runtime-worker, runtime-sandbox]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storage-consumers
spec:
  podSelector:
    matchLabels:
      app: storage
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [gateway, admin, knowledge, runtime-server, runtime-worker, canvas, canvas-worker]
      ports:
        - protocol: TCP
          port: 9013
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chat-to-runtime
spec:
  podSelector:
    matchLabels:
      app: runtime-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: chat
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chat-to-admin-rpc
spec:
  podSelector:
    matchLabels:
      app: admin
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: chat
      ports:
        - protocol: TCP
          port: 9001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runtime-to-dependencies
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [knowledge, canvas]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: runtime-server
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runtime-server-to-worker
spec:
  podSelector:
    matchLabels:
      app: runtime-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: runtime-server
      ports:
        - protocol: TCP
          port: 8011
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-knowledge-to-admin
spec:
  podSelector:
    matchLabels:
      app: admin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: knowledge
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-canvas-to-knowledge
spec:
  podSelector:
    matchLabels:
      app: knowledge
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: canvas
      ports:
        - protocol: TCP
          port: 8010
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-canvas-to-admin
spec:
  podSelector:
    matchLabels:
      app: admin
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [canvas, canvas-worker]
      ports:
        - protocol: TCP
          port: 8001
