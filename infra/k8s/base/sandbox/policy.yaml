apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandbox
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: sandbox }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-control
spec:
  podSelector:
    matchLabels: { app: sandbox }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: chat }
      ports:
        - { protocol: TCP, port: 8014 }
