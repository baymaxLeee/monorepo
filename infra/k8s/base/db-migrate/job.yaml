# One-shot deploy-time Job — runs BEFORE the application Deployment is rolled.
#
# Since ADR-0029, service SQL schema is NOT applied by a per-service `/server
# migrate` entrypoint (that subcommand was removed). Schema is applied via the
# shared migrator (scripts/db-migrate.sh) or, in prod, out-of-band against the
# managed Postgres (see overlays/prod/README). The remaining deploy-time Job is
# iam's idempotent identity bootstrap (`seed`) — the sole carrier of the
# password-hashed super-admin + guest-org, lifted out of the server start path
# so replicas never race the bootstrap on every start. See docs/ADR/0030.
#
# Strategy:
#   1. CI applies this Job first (kubectl apply --wait)
#   2. Once the Job succeeds, CI applies the Deployment update
#   3. If the Job fails, the deploy is aborted (rollback)
#
# This file is a TEMPLATE. CI (see .github/workflows/deploy-prod.yml) patches:
#   - metadata.name      (iam-bootstrap-<timestamp>)
#   - image              (iam image @ the new tag)
apiVersion: batch/v1
kind: Job
metadata:
  name: iam-bootstrap
  labels: { app: iam-bootstrap }
spec:
  backoffLimit: 0
  # Auto-clean Job records 1 day after completion to avoid clutter.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: iam-bootstrap }
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: ghcr.io/example/iam:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: ENVIRONMENT, value: production }
          envFrom:
            # Reuse the same Secret/Config the service uses, so credentials match.
            - secretRef: { name: iam-secrets }
            - configMapRef: { name: iam-config }
          command: ["/server"]
          args: ["seed"]
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
