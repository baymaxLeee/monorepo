# One-shot schema migration job. CI gives every deploy a unique name and pins
# the db-init image to the same immutable release tag as the services.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels: { app: db-migrate }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: db-migrate }
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/example/db-init:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_HOST
              valueFrom: { secretKeyRef: { name: postgres-admin-secrets, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_ADMIN_USER
              valueFrom: { secretKeyRef: { name: postgres-admin-secrets, key: POSTGRES_ADMIN_USER } }
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-admin-secrets, key: POSTGRES_ADMIN_PASSWORD } }
            - name: IAM_POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: iam-secrets, key: POSTGRES_PASSWORD } }
            - name: ADMIN_POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: admin-secrets, key: POSTGRES_PASSWORD } }
            - name: ASSET_POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: asset-secrets, key: POSTGRES_PASSWORD } }
            - name: CANVAS_POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: canvas-secrets, key: POSTGRES_PASSWORD } }
            - name: CHAT_POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: chat-secrets, key: POSTGRES_PASSWORD } }
            - name: EXECUTOR_POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: executor-secrets, key: POSTGRES_PASSWORD } }
            - name: KNOWLEDGE_POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: knowledge-secrets, key: POSTGRES_PASSWORD } }
            - name: TELEMETRY_POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: telemetry-secrets, key: POSTGRES_PASSWORD } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
