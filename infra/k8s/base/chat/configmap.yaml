apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-config
data:
  PORT: "8009"
  ENVIRONMENT: "development"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "chat"
  REDIS_PORT: "6379"
  REDIS_DB: "2"
  # Admin owns LLM credentials. chat calls
  # `${ADMIN_SERVICE_URL}/internal/providers/...` with INTERNAL_API_TOKEN
  # (kept in the Secret).
  ADMIN_SERVICE_URL: "http://admin.default.svc.cluster.local:8001"
  STORAGE_SERVICE_URL: "http://storage.default.svc.cluster.local:8010"
  LLM_TIMEOUT_SECONDS: "60"
  AGENT_MAX_TURNS: "120"
  AGENT_RUN_TIMEOUT_SECONDS: "3600"
  AGENT_EVENT_STREAM_TTL_SECONDS: "7200"
