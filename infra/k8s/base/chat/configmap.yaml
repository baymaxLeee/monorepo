apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-config
data:
  PORT: "8009"
  ENVIRONMENT: "production"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "chat"
  REDIS_PORT: "6379"
  REDIS_DB: "2"
  # Admin owns LLM credentials. chat calls
  # `${ADMIN_SERVICE_URL}/internal/providers/...` with INTERNAL_API_TOKEN
  # (kept in the Secret).
  ADMIN_SERVICE_URL: "http://admin:8001"
  KNOWLEDGE_SERVICE_URL: "http://knowledge:8010"
  EXECUTOR_SERVICE_URL: "http://executor:8011"
