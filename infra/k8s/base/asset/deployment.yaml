apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset
  labels: { app: asset }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: asset }
  template:
    metadata:
      labels: { app: asset }
    spec:
      containers:
        - name: asset
          image: ghcr.io/example/asset:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8013 }
          envFrom:
            - configMapRef: { name: asset-config }
            - secretRef: { name: asset-secrets }
          volumeMounts:
            - name: asset-data
              mountPath: /data/assets
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          startupProbe:
            httpGet: { path: /livez, port: http }
            failureThreshold: 30
            periodSeconds: 2
      volumes:
        - name: asset-data
          persistentVolumeClaim:
            claimName: asset-data
      terminationGracePeriodSeconds: 30
