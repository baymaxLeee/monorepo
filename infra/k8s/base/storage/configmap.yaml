apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-config
data:
  ENVIRONMENT: "development"
  PORT: "8013"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "storage"
  POSTGRES_SSLMODE: "disable"
  STORAGE_DATA_DIR: "/data/assets"
  STORAGE_MAX_UPLOAD_BYTES: "5368709120"
  STORAGE_MIN_FREE_BYTES: "1073741824"
  STORAGE_GC_INTERVAL: "1h"
  STORAGE_CANDIDATE_AGE: "24h"
  STORAGE_RETENTION: "168h"
  STORAGE_DELIVERY_URL_TTL: "6h"
  REDIS_URL: "redis://redis:6379/0"
