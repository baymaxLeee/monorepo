apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  labels: { app: storage }
spec:
  replicas: 1
  selector:
    matchLabels: { app: storage }
  template:
    metadata:
      labels: { app: storage }
    spec:
      containers:
        - name: storage
          image: ghcr.io/example/storage:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8010 }
          envFrom:
            - configMapRef: { name: storage-config }
            - secretRef:    { name: storage-secrets }
          volumeMounts:
            - name: storage-data
              mountPath: /data/storage
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: storage-data
          emptyDir: {}

