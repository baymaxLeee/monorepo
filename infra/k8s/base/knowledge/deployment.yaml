apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge
  labels: { app: knowledge }
spec:
  replicas: 1
  selector:
    matchLabels: { app: knowledge }
  template:
    metadata:
      labels: { app: knowledge }
    spec:
      containers:
        - name: knowledge
          image: ghcr.io/example/knowledge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8010 }
          envFrom:
            - configMapRef: { name: knowledge-config }
            - secretRef:    { name: knowledge-secrets }
          volumeMounts:
            - name: knowledge-data
              mountPath: /data/objects
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: knowledge-data
          emptyDir: {}
