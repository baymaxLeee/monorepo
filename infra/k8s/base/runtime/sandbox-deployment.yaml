apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-sandbox
  labels: { app: runtime-sandbox, app.kubernetes.io/part-of: runtime }
spec:
  replicas: 2
  selector:
    matchLabels: { app: runtime-sandbox }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: runtime-sandbox, app.kubernetes.io/part-of: runtime }
    spec:
      serviceAccountName: runtime-sandbox
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: runtime-sandbox }
      containers:
        - name: runtime-sandbox
          image: ghcr.io/example/runtime:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "--import", "tsx", "src/cmd/sandbox/main.ts"]
          env:
            - { name: HOME, value: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports:
            - { name: http, containerPort: 8014 }
          envFrom:
            - configMapRef: { name: runtime-sandbox-config }
            - secretRef: { name: runtime-sandbox-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
      terminationGracePeriodSeconds: 30
