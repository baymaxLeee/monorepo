apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-server-config
data:
  PORT: "8015"
  ENVIRONMENT: "production"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "runtime"
  REDIS_PORT: "6379"
  REDIS_DB: "2"
  ADMIN_RPC_TARGET: "admin:9001"
  KNOWLEDGE_RPC_TARGET: "knowledge:9010"
  STORAGE_RPC_TARGET: "storage:9013"
  CANVAS_RPC_TARGET: "canvas:9012"
  RUNTIME_WORKER_URL: "http://runtime-worker:8011"
  RUNTIME_SANDBOX_URL: "http://runtime-sandbox:8014"
  RUNTIME_AGENT_LEASE_SECONDS: "30"
