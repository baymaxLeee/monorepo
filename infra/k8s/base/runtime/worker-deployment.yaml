apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-worker
  labels: { app: runtime-worker, app.kubernetes.io/part-of: runtime }
spec:
  replicas: 2
  selector:
    matchLabels: { app: runtime-worker }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: runtime-worker, app.kubernetes.io/part-of: runtime }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: runtime-worker }
      containers:
        - name: runtime-worker
          image: ghcr.io/example/runtime:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "--import", "tsx", "src/cmd/worker/production.ts"]
          ports:
            - { name: http, containerPort: 8011 }
          envFrom:
            - configMapRef: { name: runtime-worker-config }
            - secretRef: { name: runtime-worker-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
      terminationGracePeriodSeconds: 30
