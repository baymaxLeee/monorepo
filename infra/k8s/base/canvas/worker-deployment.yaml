apiVersion: apps/v1
kind: Deployment
metadata:
  name: canvas-worker
  labels: { app: canvas-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: canvas-worker }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: canvas-worker }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: canvas-worker }
      containers:
        - name: canvas-worker
          image: ghcr.io/example/canvas:latest
          imagePullPolicy: IfNotPresent
          command: ["/canvas-worker"]
          ports:
            - { name: health, containerPort: 8012 }
          envFrom:
            - configMapRef: { name: canvas-config }
            - secretRef: { name: canvas-secrets }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 2000m, memory: 1Gi }
          livenessProbe:
            httpGet: { path: /livez, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /livez, port: health }
            failureThreshold: 30
            periodSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
      terminationGracePeriodSeconds: 30
