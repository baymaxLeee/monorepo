apiVersion: v1
kind: Secret
metadata:
  name: executor-secrets
type: Opaque
stringData:
  POSTGRES_HOST: "REPLACE_ME"
  POSTGRES_USER: "executor"
  POSTGRES_PASSWORD: "REPLACE_ME"
  # Full postgres:// connection string for the managed Workflow World
