services:
  mysql:
    image: mysql:8.4
    container_name: monorepo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
      MYSQL_DATABASE: admin
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # No workflow-postgres here: `executor`'s Workflow World defaults to the
  # filesystem-backed Local World when WORKFLOW_TARGET_WORLD is unset, which
  # is what every local-dev / test run against this stack actually uses.
  # Deployed environments (infra/single-vps/docker-compose.prod.yml,
  # infra/k8s/*) provision @workflow/world-postgres for real durability
  # across replicas/restarts — that's a deployment concern, not a local-dev
  # one. Don't add it back here "just in case"; it was reviewed out once
  # already for adding container weight with zero local payoff.

volumes:
  mysql_data:
