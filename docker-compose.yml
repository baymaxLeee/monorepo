services:
  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Single shared Postgres instance (one instance, many databases):
  #   - `workflow`  → executor's Workflow DevKit World (@workflow/world-postgres)
  #   - `knowledge` → knowledge service business rows + RAG vectors (pgvector)
  #   - `iam` / `admin` / `chat` / `executor` / `telemetry` → each service's own
  #     business schema (all migrated off MySQL — see docs/ADR/0029)
  # Image is pgvector/pgvector (a superset of the official postgres image) so the
  # knowledge DB can `CREATE EXTENSION vector`; the other DBs are unaffected.
  #
  # Dev/prod parity (explicit product decision — see docs/微服务/executor.md):
  # every deployed environment runs executor against the self-hosted Postgres
  # World, so local dev runs the same container rather than defaulting to the
  # filesystem-backed Local World. This is also how the missing
  # `getWorld().start()` call (see executor/AGENTS.md "Known operational
  # notes" #3) was caught in the first place — Local World would have hidden
  # it in every local run.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: monorepo-postgres
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
