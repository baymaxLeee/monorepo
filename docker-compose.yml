services:
  mysql:
    image: mysql:8.4
    container_name: monorepo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
      MYSQL_DATABASE: admin
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dev/prod parity (explicit product decision — see docs/微服务/executor.md):
  # every deployed environment runs executor against the self-hosted Postgres
  # World, so local dev runs the same container rather than defaulting to the
  # filesystem-backed Local World. This is also how the missing
  # `getWorld().start()` call (see executor/AGENTS.md "Known operational
  # notes" #3) was caught in the first place — Local World would have hidden
  # it in every local run.
  workflow-postgres:
    image: postgres:16-alpine
    container_name: monorepo-workflow-postgres
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports: ["5432:5432"]
    volumes:
      - workflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  workflow_postgres_data:
