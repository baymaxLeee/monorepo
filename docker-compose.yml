services:
  mysql:
    image: mysql:8.4
    container_name: monorepo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
      MYSQL_DATABASE: admin
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Durable backend for the chat service's Workflow DevKit "World".
  # Holds workflow run/step/event/hook state ONLY — business tables stay in MySQL.
  workflow-postgres:
    image: postgres:16-alpine
    container_name: monorepo-workflow-postgres
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: workflow
    ports: ["5432:5432"]
    volumes:
      - workflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev", "-d", "workflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  workflow_pgdata:
