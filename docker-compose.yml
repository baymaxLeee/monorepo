services:
  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Single shared Postgres instance (one instance, many databases):
  #   - `workflow`  → executor's Workflow DevKit World (@workflow/world-postgres)
  #   - `knowledge` → knowledge service business rows + RAG vectors (pgvector)
  #   - `iam` / `admin` / `chat` / `executor` / `telemetry` → each service's own
  #     business schema (all migrated off MySQL — see docs/ADR/0029)
  # Image is pgvector/pgvector (a superset of the official postgres image) so the
  # knowledge DB can `CREATE EXTENSION vector`; the other DBs are unaffected.
  #
  # Dev/prod parity (explicit product decision — see docs/微服务/executor.md):
  # every deployed environment runs executor against the self-hosted Postgres
  # World, so local dev runs the same container rather than defaulting to the
  # filesystem-backed Local World. This is also how the missing
  # `getWorld().start()` call (see executor/AGENTS.md "Known operational
  # notes" #3) was caught in the first place — Local World would have hidden
  # it in every local run.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: monorepo-postgres
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.6.1.1193
    container_name: monorepo-clickhouse
    profiles: ["observability"]
    mem_limit: 1200m
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./infra/single-vps/clickhouse-low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./infra/single-vps/clickhouse-users.xml:/etc/clickhouse-server/users.d/low-memory.xml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    container_name: monorepo-otel-collector
    profiles: ["observability"]
    mem_limit: 256m
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - ./infra/single-vps/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
