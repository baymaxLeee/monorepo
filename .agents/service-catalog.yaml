# Canonical deployable service catalog — consumed by dev preflight, CI, and docs.
# Keep in sync with infra/single-vps/docker-compose.prod.yml and infra/k8s/base/**.

services:
  - id: gateway
    runtime: go
    port: 8000
    openapi: null
    health: /livez
    ready: /readyz
    db: null

  - id: iam
    runtime: go
    port: 8002
    openapi: schemas/openapi/iam-server.json
    health: /livez
    ready: /readyz
    db: iam

  - id: admin
    runtime: python
    port: 8001
    openapi: schemas/openapi/admin-server.json
    health: /livez
    ready: /readyz
    db: admin

  - id: chat
    runtime: node
    port: 8009
    openapi: schemas/openapi/chat-server.json
    health: /livez
    ready: /readyz
    db: chat

  - id: executor
    runtime: node
    port: 8011
    openapi: schemas/openapi/executor-server.json
    health: /livez
    ready: /readyz
    db: executor

  - id: knowledge
    runtime: python
    port: 8010
    openapi: schemas/openapi/knowledge-server.json
    health: /livez
    ready: /readyz
    db: knowledge

  - id: telemetry
    runtime: python
    port: 8008
    openapi: schemas/openapi/telemetry-server.json
    health: /livez
    ready: /readyz
    db: telemetry

  - id: web
    runtime: static
    port: 3000
    openapi: null
    health: /
    ready: /
    db: null
