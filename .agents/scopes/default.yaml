# Guidance, not an execution permission system. Respect already-authorized scope.
guard_rails:
  generated_or_sensitive:
    - "**/generated/**"
    - "schemas/openapi/**"
    - "apps/backend/services/*/migrations/**"
    - "**/.env*"
    - "**/pnpm-lock.yaml"
    - "**/uv.lock"
    - "**/go.sum"
    - ".worktrees/**"
    - "**/node_modules/**"
    - "**/.venv/**"
  trace_consumers_before_editing:
    - "apps/backend/libs/**"
    - "apps/frontend/packages/**"
    - "schemas/**"
    - "infra/**"
    - ".github/workflows/**"
    - "docker-compose.yml"
    - "apps/frontend/apps/platform/**"
    - "AGENTS.md"
  usual_feature_locations:
    - "apps/backend/services/**"
    - "apps/frontend/apps/**"
    - "docs/**"
