syntax = "proto3";

package knowledge.v1;

import "common/v1/context.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/example/monorepo/inner-api-go/gen/knowledge/v1;knowledgev1";

service DocumentService {
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc GetWorkspaceDocument(GetWorkspaceDocumentRequest) returns (GetWorkspaceDocumentResponse);
  rpc GetDocumentSlice(GetDocumentSliceRequest) returns (GetDocumentSliceResponse);
  rpc UpdateArtifact(UpdateArtifactRequest) returns (UpdateArtifactResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc CreateMediaDocument(CreateMediaDocumentRequest) returns (CreateMediaDocumentResponse);
}

service StagedMediaService {
  rpc CreateStagedMedia(CreateStagedMediaRequest) returns (CreateStagedMediaResponse);
  rpc GetStagedMedia(GetStagedMediaRequest) returns (GetStagedMediaResponse);
  rpc PublishStagedMedia(PublishStagedMediaRequest) returns (PublishStagedMediaResponse);
  rpc DiscardStagedMedia(DiscardStagedMediaRequest) returns (DiscardStagedMediaResponse);
}

service ConversationDocumentService {
  rpc CleanupArtifacts(CleanupArtifactsRequest) returns (CleanupArtifactsResponse);
  rpc ForkDocuments(ForkDocumentsRequest) returns (ForkDocumentsResponse);
}

service RetrievalService {
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
}

enum DocumentKind {
  DOCUMENT_KIND_UNSPECIFIED = 0;
  DOCUMENT_KIND_SOURCE = 1;
  DOCUMENT_KIND_ARTIFACT = 2;
}

enum IngestStatus {
  INGEST_STATUS_UNSPECIFIED = 0;
  INGEST_STATUS_PENDING = 1;
  INGEST_STATUS_STORING = 2;
  INGEST_STATUS_RECEIVED = 3;
  INGEST_STATUS_CONVERTING = 4;
  INGEST_STATUS_READY = 5;
  INGEST_STATUS_FAILED = 6;
}

enum IndexStatus {
  INDEX_STATUS_UNSPECIFIED = 0;
  INDEX_STATUS_PENDING = 1;
  INDEX_STATUS_INDEXING = 2;
  INDEX_STATUS_INDEXED = 3;
  INDEX_STATUS_SKIPPED = 4;
  INDEX_STATUS_FAILED = 5;
}

message Document {
  string id = 1;
  string user_id = 2;
  optional string workspace_id = 3;
  optional string tenant_id = 4;
  optional string conversation_id = 5;
  DocumentKind kind = 6;
  string title = 7;
  string filename = 8;
  string mime_type = 9;
  bool editable_source = 10;
  string content_markdown = 11;
  int64 source_size = 12;
  optional string source_mime_type = 13;
  optional string asset_id = 14;
  optional string source_revision_id = 15;
  optional string source_sha256 = 16;
  optional string source_filename = 17;
  IngestStatus ingest_status = 18;
  int32 ingest_progress = 19;
  optional string ingest_error = 20;
  IndexStatus index_status = 21;
  optional string index_error = 22;
  google.protobuf.Timestamp created_at = 23;
  google.protobuf.Timestamp updated_at = 24;
}

message ListDocumentsRequest {
  common.v1.ActorContext actor = 1;
  optional string conversation_id = 2;
  optional DocumentKind kind = 3;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
}

message GetDocumentRequest {
  common.v1.ActorContext actor = 1;
  string document_id = 2;
}

message GetDocumentResponse {
  Document document = 1;
}

message GetWorkspaceDocumentRequest {
  common.v1.ActorContext actor = 1;
  string document_id = 2;
}

message GetWorkspaceDocumentResponse {
  Document document = 1;
}

message GetDocumentSliceRequest {
  common.v1.ActorContext actor = 1;
  string document_id = 2;
  int64 start = 3;
  int64 max_chars = 4;
  int64 wait_millis = 5;
}

enum DocumentSliceState {
  DOCUMENT_SLICE_STATE_UNSPECIFIED = 0;
  DOCUMENT_SLICE_STATE_READY = 1;
  DOCUMENT_SLICE_STATE_PROCESSING = 2;
  DOCUMENT_SLICE_STATE_FAILED = 3;
}

message DocumentSlice {
  string id = 1;
  string title = 2;
  string filename = 3;
  string mime_type = 4;
  string content = 5;
  int64 start = 6;
  int64 total_chars = 7;
  optional int64 next_start = 8;
  DocumentSliceState state = 9;
  optional string error = 10;
}

message GetDocumentSliceResponse {
  DocumentSlice slice = 1;
}

message UpdateArtifactRequest {
  common.v1.ActorContext actor = 1;
  string document_id = 2;
  optional string title = 3;
  optional string filename = 4;
  optional string content = 5;
  optional string mime_type = 6;
  optional google.protobuf.Timestamp expected_updated_at = 7;
}

message UpdateArtifactResponse {
  Document document = 1;
}

message DeleteDocumentRequest {
  common.v1.ActorContext actor = 1;
  string document_id = 2;
}

message DeleteDocumentResponse {}

message CreateMediaDocumentRequest {
  common.v1.ActorContext actor = 1;
  optional string conversation_id = 2;
  string title = 3;
  string asset_id = 4;
  string revision_id = 5;
  optional string idempotency_key = 6;
}

message CreateMediaDocumentResponse {
  Document document = 1;
}

enum StagedMediaStatus {
  STAGED_MEDIA_STATUS_UNSPECIFIED = 0;
  STAGED_MEDIA_STATUS_STAGED = 1;
  STAGED_MEDIA_STATUS_PUBLISHED = 2;
  STAGED_MEDIA_STATUS_DISCARDED = 3;
}

message StagedMedia {
  string id = 1;
  string user_id = 2;
  string workspace_id = 3;
  string tenant_id = 4;
  optional string conversation_id = 5;
  string title = 6;
  string filename = 7;
  string mime_type = 8;
  int64 size = 9;
  string asset_id = 10;
  string revision_id = 11;
  string sha256 = 12;
  StagedMediaStatus status = 13;
  optional string document_id = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message CreateStagedMediaRequest {
  common.v1.ActorContext actor = 1;
  optional string conversation_id = 2;
  string title = 3;
  string asset_id = 4;
  string revision_id = 5;
  optional string idempotency_key = 6;
}

message CreateStagedMediaResponse {
  StagedMedia staged_media = 1;
}

message GetStagedMediaRequest {
  common.v1.ActorContext actor = 1;
  string staged_media_id = 2;
}

message GetStagedMediaResponse {
  StagedMedia staged_media = 1;
}

message PublishStagedMediaRequest {
  common.v1.ActorContext actor = 1;
  string staged_media_id = 2;
}

message PublishStagedMediaResponse {
  Document document = 1;
}

message DiscardStagedMediaRequest {
  common.v1.ActorContext actor = 1;
  string staged_media_id = 2;
}

message DiscardStagedMediaResponse {
  StagedMedia staged_media = 1;
}

message CleanupArtifactsRequest {
  common.v1.ActorContext actor = 1;
  string conversation_id = 2;
}

message CleanupArtifactsResponse {
  string conversation_id = 1;
  int64 deleted_documents = 2;
  int64 deleted_generations = 3;
  int64 deleted_staged_media = 4;
  int64 released_asset_claims = 5;
}

message ForkDocumentsRequest {
  common.v1.ActorContext actor = 1;
  string source_conversation_id = 2;
  string conversation_id = 3;
}

message ForkDocumentsResponse {
  map<string, string> document_ids = 1;
}

message RetrieveRequest {
  common.v1.ActorContext actor = 1;
  string query = 2;
  optional int32 top_k = 3;
}

message RetrievedChunk {
  string document_id = 1;
  int32 chunk_index = 2;
  string content = 3;
  double score = 4;
  string title = 5;
  string filename = 6;
  string media_type = 7;
}

message RetrieveResponse {
  string query = 1;
  repeated RetrievedChunk chunks = 2;
  optional string note = 3;
}
