syntax = "proto3";

package canvas.v1;

import "common/v1/context.proto";

option go_package = "github.com/example/monorepo/inner-api-go/gen/canvas/v1;canvasv1";

service CanvasService {
  rpc GetGraph(GetGraphRequest) returns (GetGraphResponse);
  rpc StartStoryboardDrafts(StartStoryboardDraftsRequest) returns (StartStoryboardDraftsResponse);
  rpc GenerateNodes(GenerateNodesRequest) returns (GenerateNodesResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
}

message GetGraphRequest {
  common.v1.ActorContext actor = 1;
  string workspace_role = 2;
  string project_id = 3;
  string canvas_id = 4;
}

message GetGraphResponse {
  CanvasGraph graph = 1;
}

message CanvasGraph {
  repeated CanvasVideoArchiveExport archives = 1;
  CanvasSummary canvas = 2;
  int64 cursor = 3;
  repeated CanvasNode nodes = 4;
  repeated string protected_node_ids = 5;
  repeated CanvasTask tasks = 6;
  repeated CanvasTextCheckpoint texts = 7;
}

message CanvasVideoArchiveExport {
  string canvas_id = 1;
  string created_at = 2;
  optional string error_code = 3;
  optional string error_message = 4;
  optional string finished_at = 5;
  int32 input_count = 6;
  string output_filename = 7;
  int64 output_size = 8;
  optional string path = 9;
  string project_id = 10;
  optional string retention_guaranteed_until = 11;
  optional string started_at = 12;
  int32 status = 13;
  string task_run_id = 14;
}

message CanvasSummary {
  string canvas_id = 1;
  optional string cover_image_asset_id = 2;
  optional string cover_image_revision_id = 3;
  optional string cover_image_url = 4;
  string created_at = 5;
  string created_by = 6;
  int32 default_view = 7;
  optional string fallback_cover_image_url = 8;
  string name = 9;
  string project_id = 10;
  int64 revision = 11;
  CanvasStats stats = 12;
  string updated_at = 13;
}

message CanvasStats {
  int32 canvas_node_count = 1;
  int64 selected_video_duration_millis = 2;
}

message CanvasNode {
  optional string active_task_run_id = 1;
  optional int32 active_task_type = 2;
  optional string asset_id = 3;
  string canvas_id = 4;
  int64 canvas_node_no = 5;
  string created_at = 6;
  string created_by = 7;
  optional string current_asset_id = 8;
  optional CanvasNodeDraftSession draft_session = 9;
  optional string first_frame_asset_id = 10;
  optional string first_frame_url = 11;
  optional GenerationConfig generation_config = 12;
  repeated CanvasEdge incoming_edges = 13;
  optional string last_frame_asset_id = 14;
  optional GenerationFailure latest_generation_failure = 15;
  string name = 16;
  string node_id = 17;
  Position position = 18;
  optional string preview_url = 19;
  string prompt = 20;
  int32 reference_status = 21;
  optional int32 reference_type = 22;
  optional string resource_asset_id = 23;
  optional bool resource_asset_is_primary = 24;
  optional int64 resource_asset_revision = 25;
  optional string resource_id = 26;
  repeated AssetReview reviews = 27;
  int64 revision = 28;
  optional string selected_asset_id = 29;
  optional int32 selected_output_duration_seconds = 30;
  optional string selected_output_id = 31;
  optional string selected_output_text = 32;
  optional string selected_output_url = 33;
  int32 status = 34;
  optional int64 storyboard_rank = 35;
  optional string text = 36;
  int32 type = 37;
  string updated_at = 38;
  string updated_by = 39;
  optional int32 video_input_mode = 40;
}

message Position {
  double position_x = 1;
  double position_y = 2;
}
message GenerationConfig {
  string model_service_id = 1;
  int32 resolution = 2;
  int32 aspect_ratio = 3;
  int32 duration_seconds = 4;
  bool generate_audio = 5;
  bool watermark = 6;
}
message CanvasEdge {
  string edge_id = 1;
  string source_node_id = 2;
  int32 source_port = 3;
  int32 target_order = 4;
  int32 target_port = 5;
}
message GenerationFailure {
  optional string error_code = 1;
  optional string error_message = 2;
  optional string seedance_task_id = 3;
  string task_run_id = 4;
}
message AssetReview {
  optional string failure_reason = 1;
  string package_id = 2;
  string package_name = 3;
  int32 status = 4;
  optional string submitted_at = 5;
  string updated_at = 6;
}
message CanvasTask {
  string error_code = 1;
  string error_message = 2;
  string node_id = 3;
  string seedance_task_id = 4;
  int32 status = 5;
  string task_run_id = 6;
  int32 task_type = 7;
  optional int32 video_provider_status = 8;
}
message CanvasTextCheckpoint {
  string content = 1;
  string node_id = 2;
  int64 offset = 3;
  string status = 4;
  string task_run_id = 5;
}

message CanvasNodeDraftAssetReference {
  string anchor_text = 1;
  optional string asset_id = 2;
  optional string label = 3;
  optional int32 media_type = 4;
  string resource_asset_id = 5;
  string target_field = 6;
}
message CanvasNodeDraft {
  repeated CanvasNodeDraftAssetReference asset_references = 1;
  int64 canvas_node_no = 2;
  string draft_id = 3;
  int32 duration_seconds = 4;
  string prompt = 5;
}
message StoryboardPlanningConfig {
  optional int32 canvas_node_duration_max_seconds = 1;
  optional int32 canvas_node_duration_min_seconds = 2;
  optional int32 total_duration_max_seconds = 3;
  optional int32 total_duration_min_seconds = 4;
}
message StoryboardVideoParameters {
  int32 aspect_ratio = 1;
  bool generate_audio = 2;
  int32 resolution = 3;
  bool watermark = 4;
}
message StoryboardModelConfig {
  optional string inference_model_service_id = 1;
  optional string video_model_service_id = 2;
  StoryboardVideoParameters video_parameters = 3;
}
message CanvasNodeDraftSession {
  repeated CanvasNodeDraft canvas_nodes = 1;
  optional StoryboardModelConfig model_config = 2;
  optional StoryboardPlanningConfig planning_config = 3;
  string plot = 4;
  int32 status = 5;
  string task_run_id = 6;
}

message StartStoryboardDraftsRequest {
  common.v1.ActorContext actor = 1;
  string workspace_role = 2;
  string project_id = 3;
  string canvas_id = 4;
  string plot = 5;
  StoryboardPlanningConfig planning_config = 6;
  StoryboardModelConfig model_config = 7;
}

message StartStoryboardDraftsResponse {
  optional CanvasNodeDraft canvas_node = 1;
  optional CanvasNodesCompleted completed = 2;
  optional CanvasNodesError error = 3;
  optional CanvasNodeDraftSession session = 4;
}
message CanvasNodesCompleted {
  int32 count = 1;
}
message CanvasNodesError {
  string code = 1;
  string message = 2;
}

message GenerateNodesRequest {
  common.v1.ActorContext actor = 1;
  string workspace_role = 2;
  string project_id = 3;
  string canvas_id = 4;
  repeated string node_ids = 5;
}
message NodeGeneration {
  string node_id = 1;
  string task_run_id = 2;
}
message GenerateNodesResponse {
  repeated NodeGeneration items = 1;
}

message GenerationConfigPatch {
  optional string model_service_id = 1;
  optional int32 resolution = 2;
  optional int32 aspect_ratio = 3;
  optional int32 duration_seconds = 4;
  optional bool generate_audio = 5;
  optional bool watermark = 6;
}

message UpdateNodeRequest {
  common.v1.ActorContext actor = 1;
  string workspace_role = 2;
  string project_id = 3;
  string canvas_id = 4;
  string node_id = 5;
  optional string name = 6;
  optional string prompt = 7;
  optional string text = 8;
  optional Position position = 9;
  optional int32 video_input_mode = 10;
  optional GenerationConfigPatch generation_config = 11;
}
message UpdateNodeResponse {
  CanvasNode canvas_node = 1;
}
