syntax = "proto3";

package storage.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/example/monorepo/inner-api-go/gen/storage/v1;storagev1";

service AssetService {
  rpc Upload(stream UploadRequest) returns (UploadResponse);
  rpc AppendRevision(stream AppendRevisionRequest) returns (AppendRevisionResponse);
  rpc DescribeRevision(DescribeRevisionRequest) returns (DescribeRevisionResponse);
  rpc ReadContent(ReadContentRequest) returns (stream ReadContentResponse);
  rpc ReadImageVariant(ReadImageVariantRequest) returns (stream ReadImageVariantResponse);
}

service ClaimService {
  rpc PrepareClaim(PrepareClaimRequest) returns (PrepareClaimResponse);
  rpc ActivateClaim(ActivateClaimRequest) returns (ActivateClaimResponse);
  rpc ReleaseClaim(ReleaseClaimRequest) returns (ReleaseClaimResponse);
}

service UploadSessionService {
  rpc CreateUploadSession(CreateUploadSessionRequest) returns (CreateUploadSessionResponse);
  rpc DescribeUploadSession(DescribeUploadSessionRequest) returns (DescribeUploadSessionResponse);
}

service DeliveryService {
  rpc MintCapabilities(MintCapabilitiesRequest) returns (MintCapabilitiesResponse);
}

message UploadMetadata {
  string filename = 1;
  string media_type = 2;
  string idempotency_key = 3;
}

message UploadRequest {
  oneof value {
    UploadMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message AppendRevisionMetadata {
  string asset_id = 1;
  string filename = 2;
  string media_type = 3;
  string idempotency_key = 4;
  string base_revision_id = 5;
  string owner_type = 6;
  string owner_id = 7;
  string slot = 8;
  int64 generation = 9;
}

message AppendRevisionRequest {
  oneof value {
    AppendRevisionMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadResult {
  string asset_id = 1;
  string revision_id = 2;
  string filename = 3;
  string media_type = 4;
  int64 size_bytes = 5;
  string sha256 = 6;
}

message UploadResponse {
  UploadResult result = 1;
}

message AppendRevisionResponse {
  UploadResult result = 1;
}

message DescribeRevisionRequest {
  string asset_id = 1;
  string revision_id = 2;
}

message RevisionMetadata {
  string asset_id = 1;
  string revision_id = 2;
  string filename = 3;
  string media_type = 4;
  int64 size_bytes = 5;
  string sha256 = 6;
}

message DescribeRevisionResponse {
  RevisionMetadata revision = 1;
}

message ReadContentRequest {
  string asset_id = 1;
  string revision_id = 2;
  optional int64 offset = 3;
  optional int64 limit = 4;
}

message ReadImageVariantRequest {
  string asset_id = 1;
  string revision_id = 2;
  optional int32 max_dimension = 3;
}

message ContentMetadata {
  string filename = 1;
  string media_type = 2;
  int64 size_bytes = 3;
  string sha256 = 4;
}

message ContentChunk {
  oneof value {
    ContentMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message ReadContentResponse {
  ContentChunk value = 1;
}

message ReadImageVariantResponse {
  ContentChunk value = 1;
}

enum ClaimKind {
  CLAIM_KIND_UNSPECIFIED = 0;
  CLAIM_KIND_STRONG = 1;
  CLAIM_KIND_SNAPSHOT = 2;
  CLAIM_KIND_LEASE = 3;
  CLAIM_KIND_WEAK = 4;
}

enum ClaimStatus {
  CLAIM_STATUS_UNSPECIFIED = 0;
  CLAIM_STATUS_PENDING = 1;
  CLAIM_STATUS_ACTIVE = 2;
  CLAIM_STATUS_RELEASED = 3;
}

message Claim {
  string claim_id = 1;
  string asset_id = 2;
  string revision_id = 3;
  ClaimKind kind = 4;
  ClaimStatus status = 5;
  int64 generation = 6;
  optional google.protobuf.Timestamp expires_at = 7;
}

message PrepareClaimRequest {
  string owner_type = 1;
  string owner_id = 2;
  string slot = 3;
  int64 generation = 4;
  string asset_id = 5;
  string revision_id = 6;
  ClaimKind kind = 7;
  optional google.protobuf.Timestamp expires_at = 8;
}

message ActivateClaimRequest {
  string owner_type = 1;
  string owner_id = 2;
  string slot = 3;
  int64 generation = 4;
}

message ReleaseClaimRequest {
  string owner_type = 1;
  string owner_id = 2;
  string slot = 3;
  int64 generation = 4;
}

message PrepareClaimResponse {
  Claim claim = 1;
}

message ActivateClaimResponse {
  Claim claim = 1;
}

message ReleaseClaimResponse {
  Claim claim = 1;
}

message CreateUploadSessionRequest {
  string intent_id = 1;
  string filename = 2;
  string media_type = 3;
  int64 size_bytes = 4;
}

message DescribeUploadSessionRequest {
  string upload_session_id = 1;
}

enum UploadSessionState {
  UPLOAD_SESSION_STATE_UNSPECIFIED = 0;
  UPLOAD_SESSION_STATE_PENDING = 1;
  UPLOAD_SESSION_STATE_UPLOADING = 2;
  UPLOAD_SESSION_STATE_COMPLETED = 3;
  UPLOAD_SESSION_STATE_FAILED = 4;
  UPLOAD_SESSION_STATE_ABORTED = 5;
}

message UploadSession {
  string upload_session_id = 1;
  string intent_id = 2;
  UploadSessionState state = 3;
  string filename = 4;
  string media_type = 5;
  int64 size_bytes = 6;
  google.protobuf.Timestamp expires_at = 7;
  string upload_url = 8;
  optional string asset_id = 9;
  optional string revision_id = 10;
}

message CreateUploadSessionResponse {
  UploadSession session = 1;
}

message DescribeUploadSessionResponse {
  UploadSession session = 1;
}

message DeliveryCapabilityItem {
  string asset_id = 1;
  string revision_id = 2;
  optional int32 max_dimension = 3;
}

message MintCapabilitiesRequest {
  repeated DeliveryCapabilityItem items = 1;
}

message DeliveryCapability {
  string asset_id = 1;
  string revision_id = 2;
  string url = 3;
  google.protobuf.Timestamp expires_at = 4;
  string filename = 5;
  string media_type = 6;
  int64 size_bytes = 7;
}

message MintCapabilitiesResponse {
  repeated DeliveryCapability items = 1;
}
