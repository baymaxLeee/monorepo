packages:
  - "apps/*"
  - "packages/*"

# esbuild validates its platform binary; MSW's notice script is optional.
allowBuilds:
  esbuild: true
  msw: false

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.4'
  - '@ai-sdk/mcp@2.0.3'
  - '@ai-sdk/provider-utils@5.0.1'
  - '@ai-sdk/react@4.0.5'
  - '@ai-sdk/workflow@1.0.4'
  - ai@7.0.4
