packages:
  - "apps/*"
  - "packages/*"

# esbuild validates its platform binary; MSW's notice script is optional.
allowBuilds:
  esbuild: true
  msw: false

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.12'
  - '@ai-sdk/mcp@2.0.7'
  - '@ai-sdk/provider-utils@5.0.5'
  - '@ai-sdk/react@4.0.16'
  - ai@7.0.15
