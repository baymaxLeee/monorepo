[project]
name = "backend-workspace"
version = "0"
requires-python = ">=3.14.5,<3.15"

[tool.uv.workspace]
members = [
    "services/knowledge",
    "libs/inner-api-py",
]

[tool.uv.sources]
inner-api = { workspace = true }

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["migrations/", "build/", "dist/", "libs/inner-api-py/generated/"]
mypy_path = ["services/knowledge/src", "libs/inner-api-py/generated"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=2.1.0",
    "openapi-python-client==0.28.2",
    "pre-commit>=4.7.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.14",
    "types-python-dateutil>=2.9.0.20251115",
	"types-grpcio>=1.0.0",
	"types-protobuf>=6.30.0",
]
