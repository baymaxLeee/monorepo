[project]
name = "backend-workspace"
version = "0"
requires-python = ">=3.14.5,<3.15"

[tool.uv.workspace]
members = [
    "services/admin",
    "services/knowledge",
    "services/telemetry",
    "libs/kernel",
]

[tool.uv.sources]
kernel = { workspace = true }

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["migrations/", "build/", "dist/"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=2.1.0",
    "pre-commit>=4.7.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.14",
]
