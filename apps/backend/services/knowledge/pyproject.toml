[project]
name = "knowledge"
version = "0.1.0"
description = "Knowledge base microservice (documents, ingest, MarkItDown, RAG on Postgres+pgvector)"
requires-python = ">=3.14.5,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "cachetools>=5.5",
    "openai>=1.50",
    "markitdown[all]>=0.1.3",
    "python-multipart>=0.0.20",
    "kernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]
