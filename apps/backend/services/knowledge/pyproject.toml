[project]
name = "knowledge"
version = "0.1.0"
description = "Knowledge base microservice (documents, ingest, MarkItDown, RAG on Postgres+pgvector)"
requires-python = ">=3.14.5,<3.15"
dependencies = [
    "cryptography>=48",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "cachetools>=5.5",
    "redis>=5.0",
    "openai>=1.50",
    "markitdown[audio-transcription,docx,outlook,pdf,pptx,xls,xlsx,youtube-transcription]>=0.1.9,<0.2",
    "mcp==1.26.0",
    "python-multipart>=0.0.20",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "structlog>=24.1",
    "inner-api",
]

[tool.uv]
package = false

[tool.mypy]
mypy_path = ["src", "../../libs/inner-api-py/generated"]
explicit_package_bases = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
asyncio_mode = "auto"
addopts = "--strict-config --strict-markers"
