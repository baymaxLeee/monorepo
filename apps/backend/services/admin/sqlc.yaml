version: "2"
sql:
  - engine: postgresql
    schema: "migrations/*/*.up.sql"
    queries: internal/infrastructure/persistence/sql
    gen:
      go:
        package: sqlc
        out: internal/infrastructure/persistence/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        omit_unused_structs: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_querier_file_name: querier.gen.go
        output_files_suffix: .gen
        overrides:
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
