http_port 3128
visible_hostname sandbox-egress
pid_filename /tmp/squid.pid
cache_log /tmp/squid-cache.pipe
logformat sandbox %ts.%03tu %rm %Ss/%>Hs %<a
access_log stdio:/tmp/squid-access.pipe sandbox
cache_store_log none
cache deny all
cache_mem 8 MB
maximum_object_size_in_memory 0 KB
shutdown_lifetime 1 seconds
connect_timeout 10 seconds
request_timeout 60 seconds
read_timeout 60 seconds
client_lifetime 30 minutes
forwarded_for delete
via off
pinger_enable off
acl CONNECT method CONNECT
acl TLS_ports port 443
acl Safe_ports port 80 443
# Reject non-public destinations even when an allowed hostname resolves there.
acl private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 ::ffff:0:0/96 64:ff9b::/96 100::/64 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8
acl allowed dstdomain "/etc/squid/allowed-domains.txt"
http_access deny !Safe_ports
http_access deny CONNECT !TLS_ports
http_access deny private
http_access allow allowed
http_access deny all
