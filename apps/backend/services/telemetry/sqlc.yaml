version: "2"
sql:
  - engine: postgresql
    schema: migrations/v1.0.0/v1.0.0.0.up.sql
    queries: internal/infrastructure/persistence/sql
    gen:
      go:
        package: sqlc
        out: internal/infrastructure/persistence/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        omit_unused_structs: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_querier_file_name: querier.gen.go
        output_files_suffix: .gen
