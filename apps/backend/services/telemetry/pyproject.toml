[project]
name = "telemetry"
version = "0.1.0"
description = "Telemetry ingestion and query service (PostgreSQL backend)"
requires-python = ">=3.14.5,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "cryptography>=42",
    "kernel",
]

[tool.uv]
package = false

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
files = ["src"]
