packages:
  - "libs/transport-ts"
  - "services/chat"

# These packages ship usable prebuilt/JS fallbacks; no install scripts needed.
allowBuilds:
  "@swc/core": false
  cbor-extract: false
  esbuild: false

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.4'
  - '@ai-sdk/openai-compatible@3.0.1'
  - '@ai-sdk/provider-utils@5.0.1'
  - ai@7.0.4
