packages:
  - "libs/kernel-ts"
  - "libs/transport-ts"
  - "services/chat"
  - "services/executor"

catalog:
  ai: ^7.0.15
  "@typescript/native": npm:typescript@^7.0.2
  "@ai-sdk/provider": ^4.0.2
  "@ai-sdk/provider-utils": ^5.0.5
  "@ai-sdk/openai-compatible": ^3.0.5
  workflow: ^4.5.0
  "@workflow/world-postgres": ^4.2.0

# These packages ship usable prebuilt/JS fallbacks; no install scripts needed.
allowBuilds:
  "@swc/core": false
  cbor-extract: false
  esbuild: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@ai-sdk/openai-compatible@3.0.5'
  - '@ai-sdk/provider-utils@5.0.5'
  - '@ai-sdk/provider@4.0.2'
  - ai@7.0.15
  - '@aws-sdk/core@3.974.25'
  - '@aws-sdk/nested-clients@3.997.25'
  - '@aws-sdk/signature-v4-multi-region@3.996.37'
  - crossws@0.4.7
  - env-runner@0.1.15
  - httpxy@0.5.4
  - srvx@0.11.18
  - '@ai-sdk/gateway@4.0.12'
  - nf3@0.3.19

# nitro's file tracer nf3 shipped a broken `import { nodeFileTrace }` named
# import in 0.3.18 (fixed to a default-import destructure in 0.3.19). nitro
# only requires ^0.3.17, so pin 0.3.19 to guarantee the fixed build without a
# local patch. Drop this override once nitro's own floor moves past 0.3.19.
overrides:
  nf3: 0.3.19
