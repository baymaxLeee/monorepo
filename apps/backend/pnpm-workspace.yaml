packages:
  - "libs/kernel-ts"
  - "libs/transport-ts"
  - "services/chat"
  - "services/executor"

catalogMode: strict

catalog:
  ai: ^7.0.111
  "@typescript/native": npm:typescript@^7.0.2
  "@ai-sdk/openai": ^4.0.72
  "@ai-sdk/provider": ^4.0.17
  "@ai-sdk/provider-utils": ^5.0.45
  "@hono/node-server": ^2.1.1
  "@hono/zod-validator": ^0.9.1
  "@workflow/builders": ^4.1.14
  "@workflow/world-postgres": ^4.3.7
  hono: ^4.13.8
  nitro: 3.0.260903-beta
  workflow: ^4.8.9
  zod: ^4.6.5

# These packages ship usable prebuilt/JS fallbacks; no install scripts needed.
allowBuilds:
  "@swc/core": false
  cbor-extract: false
  esbuild: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.89'
  - ai@7.0.111

overrides:
  zod: "catalog:"
